services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erp_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/erp_pos?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ERP POS System}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  tooling:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/erp_pos?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  erp_postgres_data:
